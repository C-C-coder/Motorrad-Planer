<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motorrad Explorer – Kurven-Klassifikation (Test)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2126;
    --border: #2a3138;
    --text: #e7ebee;
    --muted: #8b96a1;
    --kehre: #e0483e;
    --enge: #e8a03c;
    --flow: #4fb06e;
    --gerade: #4a5561;
    --accent: #5b9dd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #file-input {
    font-size: 13px;
    color: var(--muted);
  }
  #map { height: 58vh; width: 100%; }
  #stats {
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 110px;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); }
  .stat-card .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .stat-card.kehre .value { color: var(--kehre); }
  .stat-card.enge .value { color: var(--enge); }
  .stat-card.flow .value { color: var(--flow); }
  .stat-card.gerade .value { color: var(--gerade); }
  #segments {
    padding: 12px 16px 40px;
    font-size: 13px;
  }
  #segments table { width: 100%; border-collapse: collapse; }
  #segments th, #segments td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  #segments th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #error {
    padding: 12px 16px;
    color: var(--kehre);
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Kurven-Klassifikation – Testansicht</h1>
    <div class="sub">Schritt 1: GPX-Import + Kurventyp-Erkennung</div>
  </div>
  <input type="file" id="file-input" accept=".gpx" />
</header>

<div id="error"></div>

<div id="map"></div>

<div id="stats"></div>
<div id="segments"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
  import { parseGPX, trackDistanceMeters, elevationGainMeters } from './js/gpxParser.js';
  import { classifyTrack, CURVE_CATEGORIES } from './js/curveClassifier.js';

  const COLORS = {
    kehre: '#e0483e',
    enge_kurve: '#e8a03c',
    flow_kurve: '#4fb06e',
    gerade: '#4a5561',
  };

  const map = L.map('map').setView([47.2, 11.4], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 19,
  }).addTo(map);

  let trackLayerGroup = L.layerGroup().addTo(map);

  async function loadAndRender(gpxText) {
    document.getElementById('error').style.display = 'none';
    try {
      const points = parseGPX(gpxText);
      const { segments, stats } = classifyTrack(points);

      trackLayerGroup.clearLayers();
      const bounds = [];

      for (const seg of segments) {
        const latlngs = seg.points.map((p) => [p.lat, p.lon]);
        latlngs.forEach((ll) => bounds.push(ll));
        L.polyline(latlngs, {
          color: COLORS[seg.category.key],
          weight: 5,
          opacity: 0.9,
        }).addTo(trackLayerGroup);
      }
      if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });

      renderStats(stats, points);
      renderSegments(segments);
    } catch (err) {
      const el = document.getElementById('error');
      el.textContent = 'Fehler: ' + err.message;
      el.style.display = 'block';
    }
  }

  function renderStats(stats, points) {
    const distanceKm = (trackDistanceMeters(points) / 1000).toFixed(1);
    const gain = Math.round(elevationGainMeters(points));

    const cards = [
      { key: 'kehre', label: 'Kehren', cls: 'kehre', value: stats.kehre.count },
      { key: 'enge_kurve', label: 'Enge Kurven', cls: 'enge', value: stats.enge_kurve.count },
      { key: 'flow_kurve', label: 'Flow-Kurven', cls: 'flow', value: stats.flow_kurve.count },
      { key: 'gerade', label: 'Geraden/Weite', cls: 'gerade', value: stats.gerade.count },
      { key: 'dist', label: 'Distanz', cls: '', value: distanceKm + ' km' },
      { key: 'ele', label: 'Höhenmeter', cls: '', value: gain + ' m' },
    ];

    document.getElementById('stats').innerHTML = cards
      .map(
        (c) => `
      <div class="stat-card ${c.cls}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
      </div>`
      )
      .join('');
  }

  function renderSegments(segments) {
    const rows = segments
      .map(
        (s) => `
      <tr>
        <td><span class="dot" style="background:${COLORS[s.category.key]}"></span>${s.category.label}</td>
        <td>${s.lengthM.toFixed(0)} m</td>
        <td>${s.pointCount}</td>
      </tr>`
      )
      .join('');

    document.getElementById('segments').innerHTML = `
      <table>
        <thead><tr><th>Kategorie</th><th>Länge</th><th>Punkte</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // Standard: den mitgelieferten Test-Track laden
  fetch('./test-track.gpx')
    .then((r) => r.text())
    .then(loadAndRender)
    .catch(() => {
      document.getElementById('error').textContent =
        'Test-Track konnte nicht geladen werden. Lade stattdessen eine eigene GPX-Datei.';
      document.getElementById('error').style.display = 'block';
    });

  // Eigene Datei hochladen
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadAndRender(reader.result);
    reader.readAsText(file);
  });
</script>

</body>
</html>
