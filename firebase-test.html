<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firebase-Verbindungstest</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14181c;
    color: #e7ebee;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 18px; }
  label { display: block; font-size: 13px; color: #8b96a1; margin-top: 10px; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #2a3138;
    background: #1c2126;
    color: #e7ebee;
    font-size: 15px;
    margin-top: 4px;
    box-sizing: border-box;
  }
  button {
    background: #5b9dd9;
    color: #0b0d0f;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px 6px 6px 0;
  }
  button.secondary {
    background: transparent;
    color: #5b9dd9;
    border: 1px solid #5b9dd9;
  }
  #log {
    margin-top: 20px;
    background: #1c2126;
    border: 1px solid #2a3138;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ok { color: #4fb06e; }
  .err { color: #e0483e; }
</style>
</head>
<body>

<h1>Firebase-Verbindungstest</h1>
<p style="color:#8b96a1; font-size: 13px;">
  Prüft E-Mail/Passwort-Login und Firestore-Schreib-/Lesezugriff
  gemäß den aktuellen Sicherheitsregeln.
</p>

<label for="email">E-Mail</label>
<input type="email" id="email" placeholder="du@example.com" />

<label for="password">Passwort</label>
<input type="password" id="password" placeholder="mindestens 6 Zeichen" />

<div>
  <button id="btn-register">Registrieren</button>
  <button id="btn-login" class="secondary">Einloggen</button>
</div>
<div>
  <button id="btn-test">Firestore-Test schreiben/lesen</button>
  <button id="btn-logout" class="secondary">Ausloggen</button>
</div>

<div id="log">Bereit.</div>

<script type="module">
  import { db, auth } from './js/firebaseConfig.js';
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    doc,
    setDoc,
    getDoc,
    serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const logEl = document.getElementById('log');
  function log(msg, cls = '') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
  }

  function getCredentials() {
    return {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    };
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      log(`Eingeloggt als: ${user.email}`, 'ok');
    } else {
      log('Nicht eingeloggt.');
    }
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
    const { email, password } = getCredentials();
    if (!email || !password) {
      log('Bitte E-Mail und Passwort eingeben.', 'err');
      return;
    }
    try {
      const result = await createUserWithEmailAndPassword(auth, email, password);
      log(`Registrierung erfolgreich: ${result.user.email}`, 'ok');
    } catch (err) {
      log('Registrierungs-Fehler: ' + err.message, 'err');
    }
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
    const { email, password } = getCredentials();
    if (!email || !password) {
      log('Bitte E-Mail und Passwort eingeben.', 'err');
      return;
    }
    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      log(`Login erfolgreich: ${result.user.email}`, 'ok');
    } catch (err) {
      log('Login-Fehler: ' + err.message, 'err');
    }
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await signOut(auth);
    log('Ausgeloggt.');
  });

  document.getElementById('btn-test').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) {
      log('Erst einloggen, dann testen.', 'err');
      return;
    }
    try {
      // Schreibt ins eigene users/{uid}-Dokument (laut Regeln erlaubt)
      const ref = doc(db, 'users', user.uid);
      await setDoc(ref, {
        email: user.email,
        lastTestAt: serverTimestamp(),
      });
      log('Schreiben erfolgreich (users/' + user.uid + ')', 'ok');

      const snap = await getDoc(ref);
      log('Lesen erfolgreich: ' + JSON.stringify(snap.data()), 'ok');
    } catch (err) {
      log('Firestore-Fehler: ' + err.message, 'err');
    }
  });
</script>

</body>
</html>
